# =============================================================================
# Woohub — Docker Compose (desenvolvimento / servidor único)
#
#   docker compose up -d
#
# BANCO EXTERNO (PostgreSQL gerenciado — Supabase):
#   Nao ha servico de banco nesta stack. Defina DATABASE_URL no .env apontando
#   para o pooler SESSION (porta 5432) com sslmode=require. A porta 6543
#   (pooler transacional) TRAVA com o Prisma — nao use.
#
# Imagens PRE-CONSTRUÍDAS (nada de build no deploy da stack de produção):
#   docker build -t woohub/app:1.6.4 .
#   docker compose up -d            # usa woohub/app:1.6.4
#
# Diferenças Compose × Swarm estão em docs/DEPLOY.md (obrigatório ler antes).
#
# LICENÇA OBRIGATÓRIA: `:?` na interpolação faz o `compose up` falhar antes de
# criar qualquer container se LICENSE_KEY estiver vazia. Com a chave presente
# porém inválida, o gate da porta de entrada (`scripts/license-entrypoint.ts`)
# sai com código 1 e o container fica `Exited (1)` — nunca serving.
# =============================================================================
name: woo-woohub

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # Job ÚNICO de migração (schema + admin inicial) contra o banco externo.
  # Termina; a app só sobe quando este serviço termina com sucesso.
  migrate:
    image: ${DOCKER_IMAGE:-ghcr.io/woohub/app}:${WOHUB_TAG:-1.6.4}
    container_name: woo-woohub-migrate
    restart: "no"
    environment:
      - LICENSE_KEY=${LICENSE_KEY:?defina LICENSE_KEY no .env (WOHUB1.* ou WOHUB-*)}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
      - LICENSE_SERVER_URL=${LICENSE_SERVER_URL:-}
      - LICENSE_GRACE_PERIOD_HOURS=${LICENSE_GRACE_PERIOD_HOURS:-24}
      - LICENSE_DOMAIN=${LICENSE_DOMAIN:-}
      - DATABASE_URL=${DATABASE_URL:?defina DATABASE_URL no .env (postgresql://...?sslmode=require)}
      - TZ=America/Sao_Paulo
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    command: ["sh", "scripts/migrate.sh"]
    networks:
      - public
    logging: *default-logging

  app:
    image: ${DOCKER_IMAGE:-ghcr.io/woohub/app}:${WOHUB_TAG:-1.6.4}
    container_name: woo-woohub-app
    # 3 tentativas e para: licença inválida vira `Exited (1)` estável, não loop.
    restart: "on-failure:3"
    # Para construir localmente (dev), descomente — produção usa imagem pronta:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?defina DATABASE_URL no .env (postgresql://...?sslmode=require)}
      - AUTH_SECRET=${AUTH_SECRET:?defina AUTH_SECRET no .env}
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NODE_ENV=production
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-CENTRAL}
      - PORT=${PORT:-3000}
      - HOSTNAME=0.0.0.0
      - TZ=America/Sao_Paulo
      - NEXT_PUBLIC_APP_URL=${BASE_URL:-http://localhost:3000}
      - NEXT_PUBLIC_API_URL=${BASE_URL:-http://localhost:3000}/api
      - BAILEYS_LOG_LEVEL=${BAILEYS_LOG_LEVEL:-error}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      # Licença (obrigatória: sem ela o compose nem cria os containers)
      - LICENSE_KEY=${LICENSE_KEY:?defina LICENSE_KEY no .env (WOHUB1.* ou WOHUB-*)}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-}
      - LICENSE_SERVER_URL=${LICENSE_SERVER_URL:-}
      - LICENSE_GRACE_PERIOD_HOURS=${LICENSE_GRACE_PERIOD_HOURS:-24}
      - LICENSE_DOMAIN=${LICENSE_DOMAIN:-}
      # Pagamento (opcional — sem isto o checkout responde 503 gateway_not_configured)
      - PAYMENT_GATEWAY=${PAYMENT_GATEWAY:-}
      - PAYMENT_GATEWAY_SECRET_KEY=${PAYMENT_GATEWAY_SECRET_KEY:-}
      - PAYMENT_WEBHOOK_SECRET=${PAYMENT_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - public
    volumes:
      - app_data:/app/data
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/system/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

networks:
  # Saida/entrada da app: banco externo (Supabase), motor WhatsApp e gateway.
  public:

volumes:
  app_data:
  uploads_data:
